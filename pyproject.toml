[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plasma-ai"
version = "0.1.0"
description = "Reduced-order ICP plasma modelling and agentic AI research-engineering project."
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.5",
]

[project.urls]
Repository = "https://github.com/ashasif/agentic-ai-plasma-optimisation"
Issues = "https://github.com/ashasif/agentic-ai-plasma-optimisation/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
